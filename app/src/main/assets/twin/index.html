<!doctype html>
<html lang="en">
<head>

      radial-gradient(ellipse at 50% 45%, rgba(30, 120, 140, 0.35), transparent 65%),

  .group { display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 4px; }

  button[hidden] { display: none; }
  #info { top: 70px; left: 12px; max-width: 260px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 8px 12px; font-size: 12px; }
  #info b { color: var(--cyan); }

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// Native bridge (Android WebView injects TwinBridge); no-op in a browser.
const bridge = window.TwinBridge ?? { onReady() {}, onNodeTap() {}, onError() {} };
const params = new URLSearchParams(location.search);
if (params.get('transparent') === '1') document.body.classList.add('transparent');

const H = 1.8; // normalized body height in metres
const STATUS_COLORS = { good: 0x34e39a, warn: 0xffc24b, risk: 0xff4d5e };
const HOLO = new THREE.Color(0x3fe0ff);

// Organ nodes along the midline, as in the reference: crown → pelvis.
// y is a fraction of body height, z pushes the node just in front of the body surface.
const ORGANS = {
  cognitive:       { label: 'Brain & Cognition', hue: 0xa77bff, y: 0.975, z: 0.0 },
  circadian:       { label: 'Sleep & Rhythm',    hue: 0x5a78ff, y: 0.915, z: 0.07 },
  immune:          { label: 'Immunity',          hue: 0x4fc8ff, y: 0.835, z: 0.04 },
  vascular:        { label: 'Heart & Vessels',   hue: 0x3cff8a, y: 0.715, z: 0.1 },
  metabolic:       { label: 'Metabolism',        hue: 0xffa23f, y: 0.62,  z: 0.1 },
  musculoskeletal: { label: 'Muscle & Skeleton', hue: 0xff4d4d, y: 0.53,  z: 0.08 },
};
// Joint markers (decorative, tap → musculoskeletal). Fallback fractions used when the model has no matching bones.
const JOINTS = {
  shoulderL: { re: /^(mixamorig)?leftarm$/i,     fb: [0.2, 0.815] },
  shoulderR: { re: /^(mixamorig)?rightarm$/i,    fb: [-0.2, 0.815] },
  elbowL:    { re: /^(mixamorig)?leftforearm$/i, fb: [0.3, 0.64] },
  elbowR:    { re: /^(mixamorig)?rightforearm$/i,fb: [-0.3, 0.64] },
  wristL:    { re: /^(mixamorig)?lefthand$/i,    fb: [0.38, 0.49] },
  wristR:    { re: /^(mixamorig)?righthand$/i,   fb: [-0.38, 0.49] },
  kneeL:     { re: /^(mixamorig)?leftleg$/i,     fb: [0.1, 0.285] },
  kneeR:     { re: /^(mixamorig)?rightleg$/i,    fb: [-0.1, 0.285] },
  ankleL:    { re: /^(mixamorig)?leftfoot$/i,    fb: [0.11, 0.045] },
  ankleR:    { re: /^(mixamorig)?rightfoot$/i,   fb: [-0.11, 0.045] },
};

let state = {
  lrs: 91, phenoAge: 47.8,
  nodes: [
    { id: 'cognitive', score: 88, status: 'good' },
    { id: 'circadian', score: 74, status: 'warn' },
    { id: 'immune', score: 83, status: 'good' },
    { id: 'vascular', score: 92, status: 'good' },
    { id: 'metabolic', score: 67, status: 'warn' },
    { id: 'musculoskeletal', score: 55, status: 'risk' },
  ],
};

// ---------- renderer ----------
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
} catch (e) {
  document.getElementById('err').style.display = 'grid';
  bridge.onError(String(e));
  throw e;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x000000, 0);
document.getElementById('stage').appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(28, 1, 0.05, 50);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.93, 0);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 2.4;
controls.maxDistance = 8;

const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType }));
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.5, 0.35, 0.3);
composer.addPass(bloom);
composer.addPass(new OutputPass());

const additive = (opts) => ({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, ...opts });

// ---------- shared uniforms ----------
const U = { uTime: { value: 0 }, uColor: { value: HOLO }, uScanY: { value: 1.4 } };

// Translucent filled body + rim light + fine horizontal scanlines + bright band at the scan beam.
function makeHoloMaterial() {
  const mat = new THREE.MeshStandardMaterial(additive({ side: THREE.FrontSide }));
  mat.onBeforeCompile = (shader) => {
    Object.assign(shader.uniforms, U);
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', '#include <common>\nvarying float vHoloY;')
      .replace('#include <project_vertex>', '#include <project_vertex>\nvHoloY = (modelMatrix * vec4(transformed, 1.0)).y;');
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', '#include <common>\nuniform float uTime;\nuniform vec3 uColor;\nuniform float uScanY;\nvarying float vHoloY;')
      .replace('#include <dithering_fragment>', `
        vec3 n = normalize(vNormal);
        vec3 v = normalize(vViewPosition);
        float fres = pow(1.0 - abs(dot(n, v)), 2.0);
        float lines = 0.8 + 0.2 * sin(vHoloY * 420.0);
        float band = smoothstep(0.05, 0.0, abs(vHoloY - uScanY));
        float a = (0.06 + fres * 0.55) * lines + band * 0.3;
        gl_FragColor = vec4(uColor * (0.3 + fres * 0.9 + band * 1.2), clamp(a, 0.0, 1.0));
      `);
  };
  return mat;
}
const wireMat = new THREE.MeshBasicMaterial(additive({ color: 0x7ff0ff, wireframe: true, opacity: 0.045 }));

// ---------- environment ----------
const env = new THREE.Group();
scene.add(env);

// Floor: concentric rings with tick marks
{
  const rings = [[0.5, 0.012, 0.85], [0.62, 0.005, 0.5], [0.78, 0.003, 0.3], [0.95, 0.002, 0.18]];
  for (const [r, w, o] of rings) {
    const m = new THREE.Mesh(new THREE.RingGeometry(r, r + w, 128), new THREE.MeshBasicMaterial(additive({ color: HOLO, opacity: o, side: THREE.DoubleSide })));
    m.rotation.x = -Math.PI / 2;
    env.add(m);
  }
  const ticks = [];
  for (let i = 0; i < 120; i++) {
    const a = (i / 120) * Math.PI * 2, r0 = 0.64, r1 = i % 10 === 0 ? 0.72 : 0.67;
    ticks.push(Math.cos(a) * r0, 0.001, Math.sin(a) * r0, Math.cos(a) * r1, 0.001, Math.sin(a) * r1);
  }
  const tg = new THREE.BufferGeometry();
  tg.setAttribute('position', new THREE.Float32BufferAttribute(ticks, 3));
  env.add(new THREE.LineSegments(tg, new THREE.LineBasicMaterial(additive({ color: HOLO, opacity: 0.35 }))));
  const disc = new THREE.Mesh(new THREE.CircleGeometry(0.5, 64), new THREE.MeshBasicMaterial(additive({ color: HOLO, opacity: 0.06 })));
  disc.rotation.x = -Math.PI / 2;
  env.add(disc);
}

// Particle sphere shell on the right side + loose amber/cyan specks
const swirl = new THREE.Group();
env.add(swirl);
{
  const pos = [], col = [];
  const cCyan = new THREE.Color(0x7fe9ff), cAmber = new THREE.Color(0xffb35a);
  for (let i = 0; i < 1400; i++) {
    const az = THREE.MathUtils.lerp(-1.2, 1.1, Math.random());
    const el = Math.asin(THREE.MathUtils.lerp(-0.92, 0.92, Math.random()));
    const r = 0.95 + (Math.random() - 0.5) * 0.06 * (1 + Math.abs(el));
    // Thin the shell towards the edges of its arc so it fades out
    if (Math.random() > Math.cos(az * 1.1) ** 2) continue;
    pos.push(Math.cos(el) * Math.cos(az) * r, 1.0 + Math.sin(el) * r, Math.cos(el) * Math.sin(az) * r * 0.6);
    const c = Math.random() < 0.85 ? cCyan : cAmber;
    col.push(c.r, c.g, c.b);
  }
  for (let i = 0; i < 160; i++) {
    const a = Math.random() * Math.PI * 2, r = 0.35 + Math.random() * 1.1;
    pos.push(Math.cos(a) * r, Math.random() * 2.0, Math.sin(a) * r * 0.5);
    const c = Math.random() < 0.6 ? cAmber : cCyan;
    col.push(c.r, c.g, c.b);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  swirl.add(new THREE.Points(g, new THREE.PointsMaterial(additive({ size: 0.011, vertexColors: true, opacity: 0.85 }))));
}

// Horizontal scan beam (camera-facing strip with bright flares at both ends)
const beam = new THREE.Group();
scene.add(beam);
{
  const strip = new THREE.Mesh(new THREE.PlaneGeometry(1.9, 0.014), new THREE.ShaderMaterial({
    ...additive({}),
    uniforms: { uColor: { value: new THREE.Color(0x9ff6ff) } },
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: `uniform vec3 uColor; varying vec2 vUv;
      void main(){ float x = abs(vUv.x - 0.5) * 2.0; float y = 1.0 - abs(vUv.y - 0.5) * 2.0;
        float a = (0.55 + 0.45 * smoothstep(0.75, 1.0, x)) * smoothstep(1.0, 0.92, x) * y;
        gl_FragColor = vec4(uColor * (1.0 + y), a); }`,
  }));
  beam.add(strip);
  const flareTex = (() => {
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.25, 'rgba(160,240,255,0.8)'); gr.addColorStop(1, 'rgba(60,200,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
    return new THREE.CanvasTexture(c);
  })();
  for (const x of [-0.95, 0.95]) {
    const s = new THREE.Sprite(new THREE.SpriteMaterial(additive({ map: flareTex })));
    s.scale.setScalar(0.09);
    s.position.x = x;
    beam.add(s);
  }
}

// ---------- inner skeleton (procedural, sized to the normalized 1.8 m body) ----------
function buildSkeleton() {
  const segs = [];
  const line = (a, b) => segs.push(...a, ...b);
  const arc = (cx, cy, cz, rx, rz, a0, a1, tilt, n = 18) => {
    let prev = null;
    for (let i = 0; i <= n; i++) {
      const a = THREE.MathUtils.lerp(a0, a1, i / n);
      const p = [cx + Math.cos(a) * rx, cy + Math.sin(a) * tilt, cz + Math.sin(a) * rz];
      if (prev) line(prev, p);
      prev = p;
    }
  };
  // Spine: vertebra ticks from sacrum to skull base
  for (let y = 0.53; y <= 0.84; y += 0.0125) {
    const w = y > 0.78 ? 0.012 : 0.02;
    line([-w, y * H, -0.04], [w, y * H, -0.04]);
  }
  line([0, 0.53 * H, -0.04], [0, 0.845 * H, -0.04]);
  // Ribs: 10 pairs curving forward from the spine
  for (let i = 0; i < 10; i++) {
    const y = (0.775 - i * 0.017) * H;
    const rx = 0.085 + Math.sin((i / 9) * Math.PI) * 0.045 + i * 0.002;
    for (const s of [1, -1]) arc(0, y, 0.0, rx * s, 0.1, -Math.PI / 2, Math.PI / 2 * 0.85, -0.035);
  }
  // Sternum
  line([0, 0.78 * H, 0.07], [0, 0.68 * H, 0.075]);
  // Clavicles
  for (const s of [1, -1]) line([0.015 * s, 0.81 * H, 0.05], [0.17 * s, 0.82 * H, 0.0]);
  // Pelvis: iliac wings + pubic arch
  for (const s of [1, -1]) {
    arc(0.075 * s, 0.56 * H, 0.0, 0.075 * s, 0.07, -Math.PI / 2, Math.PI / 2, 0.035, 14);
    line([0.13 * s, 0.53 * H, 0.0], [0.03 * s, 0.5 * H, 0.06]);
  }
  arc(0, 0.5 * H, 0.06, 0.03, 0.0, Math.PI, 0, -0.01, 8);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(segs, 3));
  return new THREE.LineSegments(g, new THREE.LineBasicMaterial(additive({ color: 0xd8fbff, opacity: 0.55 })));
}

// ---------- models ----------
const draco = new DRACOLoader().setDecoderPath('./vendor/addons/libs/draco/gltf/');
const gltfLoader = new GLTFLoader().setDRACOLoader(draco);
const twinRoot = new THREE.Group();
scene.add(twinRoot);
let mixer = null;
let boneFor = {};

function normalize(obj) {
  obj.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(obj, true);
  obj.scale.multiplyScalar(H / box.getSize(new THREE.Vector3()).y);
  obj.updateMatrixWorld(true);
  box.setFromObject(obj, true);
  const c = box.getCenter(new THREE.Vector3());
  obj.position.x -= c.x;
  obj.position.z -= c.z;
  obj.position.y -= box.min.y;
  obj.updateMatrixWorld(true);
}

function applyHolo(obj) {
  const mat = makeHoloMaterial();
  const meshes = [];
  obj.traverse((o) => { if (o.isMesh) meshes.push(o); });
  for (const o of meshes) {
    o.material = mat;
    o.frustumCulled = false;
    // Wireframe overlay; SkinnedMesh.clone() shares the skeleton so it follows animation.
    const w = o.clone();
    w.material = wireMat;
    w.renderOrder = 1;
    o.parent.add(w);
  }
}

async function loadGltf(url, { clip, freezeAt } = {}) {
  const gltf = await gltfLoader.loadAsync(url);
  const model = gltf.scene;
  if (gltf.animations.length) {
    mixer = new THREE.AnimationMixer(model);
    const anim = (clip && THREE.AnimationClip.findByName(gltf.animations, clip)) || gltf.animations[0];
    const action = mixer.clipAction(anim);
    action.play();
    if (freezeAt !== undefined) { action.time = freezeAt; action.paused = true; }
    mixer.update(0);
  }
  return model;
}

// Anatomical-ish mannequin from lathe profiles, A-pose. No external file.
function buildProcedural() {
  const g = new THREE.Group();
  const V = (pts) => pts.map(([r, y]) => new THREE.Vector2(r, y));
  const lathe = (pts, sx = 1, sz = 1) => {
    const m = new THREE.Mesh(new THREE.LatheGeometry(V(pts), 24));
    m.scale.set(sx, 1, sz);
    return m;
  };
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.1, 36, 28));
  head.scale.set(0.82, 1.08, 0.95);
  head.position.set(0, 1.665, 0.005);
  g.add(head);
  const jaw = lathe([[0, 1.565], [0.05, 1.575], [0.07, 1.61], [0.075, 1.65], [0, 1.66]], 1, 0.95);
  jaw.position.z = 0.02;
  g.add(jaw);
  g.add(lathe([[0.0, 1.47], [0.075, 1.47], [0.058, 1.52], [0.055, 1.58], [0.0, 1.58]], 1, 0.9)); // neck
  // Torso: pelvis → waist → ribcage → chest → shoulders/trapezius
  const torso = lathe([
    [0.0, 0.88], [0.1, 0.885], [0.165, 0.93], [0.17, 0.98], [0.155, 1.04], [0.14, 1.1], [0.148, 1.17],
    [0.165, 1.25], [0.178, 1.32], [0.185, 1.38], [0.17, 1.43], [0.11, 1.47], [0.06, 1.49], [0.0, 1.49],
  ], 1, 0.6);
  g.add(torso);
  // Pecs give the torso some relief
  for (const s of [-1, 1]) {
    const pec = new THREE.Mesh(new THREE.SphereGeometry(0.085, 24, 16));
    pec.scale.set(1.0, 0.7, 0.45);
    pec.position.set(0.075 * s, 1.31, 0.075);
    g.add(pec);
  }
  const marker = (parent, name, y) => { const o = new THREE.Object3D(); o.name = name; o.position.y = y; parent.add(o); };
  for (const s of [-1, 1]) {
    const side = s > 0 ? 'L' : 'R';
    // Arm, ~30° A-pose, tapered upper arm → forearm → hand
    const sh = new THREE.Group();
    sh.position.set(0.185 * s, 1.415, 0);
    sh.rotation.z = 0.5 * s;
    g.add(sh);
    const delt = new THREE.Mesh(new THREE.SphereGeometry(0.065, 24, 16));
    delt.scale.set(1, 1.1, 0.95);
    delt.position.y = -0.03;
    sh.add(delt);
    sh.add(lathe([[0, 0], [0.052, -0.02], [0.05, -0.12], [0.042, -0.24], [0.036, -0.29], [0, -0.3]]));
    marker(sh, `shoulder${side}`, -0.01);
    const el = new THREE.Group();
    el.position.y = -0.29;
    el.rotation.z = -0.08 * s;
    sh.add(el);
    el.add(lathe([[0, 0], [0.038, -0.01], [0.042, -0.07], [0.032, -0.19], [0.025, -0.25], [0, -0.26]]));
    marker(el, `elbow${side}`, 0);
    const hand = new THREE.Mesh(new THREE.SphereGeometry(0.045, 20, 14));
    hand.scale.set(0.55, 1.75, 0.95);
    hand.position.y = -0.33;
    el.add(hand);
    marker(el, `wrist${side}`, -0.255);
    // Leg: thigh → knee → calf → ankle → foot
    const hip = new THREE.Group();
    hip.position.set(0.09 * s, 0.9, 0);
    hip.rotation.z = 0.035 * s;
    g.add(hip);
    hip.add(lathe([[0, 0.02], [0.085, 0.0], [0.083, -0.1], [0.07, -0.25], [0.05, -0.4], [0.046, -0.43], [0, -0.44]], 1, 1));
    marker(hip, `knee${side}`, -0.43);
    hip.add(lathe([[0, -0.43], [0.046, -0.44], [0.055, -0.53], [0.05, -0.62], [0.033, -0.77], [0.03, -0.81], [0, -0.82]], 1, 1));
    marker(hip, `ankle${side}`, -0.81);
    const foot = new THREE.Mesh(new THREE.SphereGeometry(0.05, 20, 14));
    foot.scale.set(0.8, 0.55, 2.4);
    foot.position.set(0, -0.845, 0.06);
    hip.add(foot);
  }
  return g;
}

const MODELS = {
  human:      { name: 'Custom model (human.glb)', load: () => loadGltf('./human.glb', { clip: 'idle' }) },
  procedural: { name: 'Procedural mannequin (0 MB)', load: async () => buildProcedural() },
};

// ---------- nodes ----------
const nodeGroup = new THREE.Group();
twinRoot.add(nodeGroup);
const organNodes = new Map();
const jointNodes = new Map();
const hitTargets = [];
const coreGeo = new THREE.SphereGeometry(1, 24, 16);
const ringGeo = new THREE.RingGeometry(1.35, 1.6, 48);
const glowTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.3, 'rgba(255,255,255,0.45)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
})();

function makeNode(id, hue, radius, tapId) {
  const node = new THREE.Group();
  // Dimmed so bloom keeps the hue instead of blowing out to white.
  const core = new THREE.Mesh(coreGeo, new THREE.MeshBasicMaterial({ color: new THREE.Color(hue).multiplyScalar(0.75), transparent: true, depthTest: false }));
  core.scale.setScalar(radius);
  core.renderOrder = 10;
  const glow = new THREE.Sprite(new THREE.SpriteMaterial(additive({ map: glowTex, color: hue, depthTest: false, opacity: 0.9 })));
  glow.scale.setScalar(radius * 4);
  glow.renderOrder = 9;
  const ring = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial(additive({ color: hue, side: THREE.DoubleSide, depthTest: false, opacity: 0.85 })));
  ring.scale.setScalar(radius);
  ring.renderOrder = 11;
  const hit = new THREE.Mesh(new THREE.SphereGeometry(Math.max(radius * 3, 0.06), 8, 6), new THREE.MeshBasicMaterial({ visible: false }));
  hit.userData.id = tapId;
  node.add(glow, core, ring, hit);
  node.userData = { core, glow, ring, radius, phase: Math.random() * 6 };
  hitTargets.push(hit);
  nodeGroup.add(node);
  return node;
}

for (const [id, o] of Object.entries(ORGANS)) {
  const n = makeNode(id, o.hue, 0.026, id);
  n.position.set(0, o.y * H, o.z);
  organNodes.set(id, n);
}
for (const id of Object.keys(JOINTS)) jointNodes.set(id, makeNode(id, 0xffb35a, 0.014, 'musculoskeletal'));

function resolveJoints(model) {
  boneFor = {};
  model.traverse((o) => {
    for (const [id, j] of Object.entries(JOINTS)) {
      if (boneFor[id]) continue;
      if (o.name === id || (o.isBone && j.re.test(o.name.replace(/[:_]/g, '')))) boneFor[id] = o;
    }
  });
}

const tmpV = new THREE.Vector3();
function updateJointPositions() {
  for (const [id, n] of jointNodes) {
    const b = boneFor[id];
    if (b) {
      b.getWorldPosition(tmpV);
      nodeGroup.worldToLocal(tmpV);
      n.position.set(tmpV.x, tmpV.y, tmpV.z + 0.04);
    } else {
      const [x, y] = JOINTS[id].fb;
      n.position.set(x, y * H, 0.05);
    }
  }
}

function statusOf(id) { return state.nodes.find((n) => n.id === id); }

function applyState() {
  for (const [id, n] of organNodes) {
    const s = statusOf(id);
    // Core keeps the system hue (as in the reference); the ring shows status.
    n.userData.ring.material.color.setHex(STATUS_COLORS[s?.status] ?? STATUS_COLORS.good);
    n.userData.status = s?.status ?? 'good';
  }
  const ms = statusOf('musculoskeletal')?.status ?? 'good';
  for (const n of jointNodes.values()) n.userData.status = ms;
  document.getElementById('hud-text').textContent = `LRS: ${Math.round(state.lrs)}/100 • PhenoAge: ${Number(state.phenoAge).toFixed(1)} yrs`;
}

// ---------- view / rotation ----------
let autoRotate = false;
let viewTween = null;
const VIEWS = { front: [0, 0.0], side: [Math.PI / 2, 0.0], '3d': [Math.PI / 5, 0.18] };
let camDist = 4.6;

function setView(name) {
  if (!VIEWS[name]) return;
  const [yaw, pitch] = VIEWS[name];
  const t = controls.target;
  const to = new THREE.Vector3(Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), Math.cos(yaw) * Math.cos(pitch)).multiplyScalar(camDist).add(t);
  viewTween = { from: camera.position.clone(), to, t: 0 };
  twinRoot.rotation.y = 0;
  document.querySelectorAll('#views button').forEach((b) => b.classList.toggle('on', b.dataset.view === name));
}

function setAutoRotate(on) {
  autoRotate = !!on;
  const b = document.getElementById('rot');
  b.classList.toggle('on', autoRotate);
  b.textContent = autoRotate ? 'Rotation: ON' : 'Rotation: PAUSED';
}

// ---------- picking ----------
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let downAt = null;
renderer.domElement.addEventListener('pointerdown', (e) => { downAt = { x: e.clientX, y: e.clientY }; });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!downAt || Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) > 8) return;
  const r = renderer.domElement.getBoundingClientRect();
  pointer.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(hitTargets, false);
  if (!hits.length) return;
  const id = hits[0].object.userData.id;
  const s = statusOf(id);
  document.getElementById('info-title').textContent = `${ORGANS[id].label} — ${s?.score ?? '–'}/100`;
  document.getElementById('info-body').textContent = `Status: ${s?.status ?? '–'} • id: ${id}`;
  bridge.onNodeTap(id);
});

// ---------- model switching ----------
async function showModel(key) {
  document.querySelectorAll('#models button').forEach((b) => b.classList.toggle('on', b.dataset.model === key));
  document.getElementById('info-body').textContent = `Loading ${MODELS[key].name}…`;
  for (const c of [...twinRoot.children]) if (c !== nodeGroup) twinRoot.remove(c);
  mixer = null;
  const model = await MODELS[key].load();
  applyHolo(model);
  normalize(model);
  twinRoot.add(model);
  twinRoot.add(skeleton);
  resolveJoints(model);
  document.getElementById('info-body').textContent = `Model: ${MODELS[key].name}`;
}
const skeleton = buildSkeleton();

document.querySelectorAll('#models button').forEach((b) => b.addEventListener('click', () => showModel(b.dataset.model)));
document.querySelectorAll('#views button').forEach((b) => b.addEventListener('click', () => setView(b.dataset.view)));
document.getElementById('rot').addEventListener('click', () => setAutoRotate(!autoRotate));

// ---------- loop ----------
const clock = new THREE.Clock();
let running = true;
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h);
  composer.setSize(w, h);
  camera.aspect = w / h;
  // Keep the whole figure (incl. arms) in frame on narrow portrait screens.
  const fitH = 2.25 / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
  const fitW = 1.5 / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.aspect);
  camDist = Math.max(fitH, fitW);
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

function frame() {
  if (!running) return;
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  U.uTime.value = t;
  // Scan beam sweeps slowly, resting longer around the shoulders like the reference.
  const sweep = 0.5 - 0.5 * Math.cos(t * 0.45);
  U.uScanY.value = THREE.MathUtils.lerp(0.12, 1.72, Math.pow(sweep, 0.7));
  beam.position.y = U.uScanY.value;
  beam.quaternion.copy(camera.quaternion);
  if (mixer) mixer.update(dt);
  if (autoRotate) twinRoot.rotation.y += dt * 0.35;
  swirl.rotation.y = Math.sin(t * 0.15) * 0.25;
  updateJointPositions();
  for (const n of [...organNodes.values(), ...jointNodes.values()]) {
    const { ring, glow, radius, phase, status } = n.userData;
    ring.quaternion.copy(camera.quaternion);
    const speed = status === 'risk' ? 6 : status === 'warn' ? 3.5 : 2;
    const p = 0.5 + 0.5 * Math.sin(t * speed + phase);
    ring.scale.setScalar(radius * (1 + p * 0.5));
    glow.material.opacity = 0.35 + p * 0.3;
  }
  if (viewTween) {
    viewTween.t = Math.min(1, viewTween.t + dt * 2.2);
    camera.position.lerpVectors(viewTween.from, viewTween.to, 1 - Math.pow(1 - viewTween.t, 3));
    if (viewTween.t >= 1) viewTween = null;
  }
  controls.update();
  composer.render();
}

// Pause the render loop while the page is hidden (WebView paused / tab hidden).
document.addEventListener('visibilitychange', () => {
  const visible = document.visibilityState === 'visible';
  if (visible && !running) { running = true; clock.getDelta(); frame(); }
  else if (!visible) running = false;
});

// ---------- public API (Kotlin calls these through evaluateJavascript) ----------
window.twin = {
  update(json) {
    const d = typeof json === 'string' ? JSON.parse(json) : json;
    state = { ...state, ...d };
    applyState();
  },
  setView,
  setAutoRotate,
  setModel: showModel,
};

applyState();
camera.position.set(0, controls.target.y, camDist);
setView('front');
setAutoRotate(false);
const hasCustom = await fetch('./human.glb', { method: 'HEAD' }).then((r) => r.ok).catch(() => false);
document.querySelector('[data-model="human"]').hidden = !hasCustom;
await showModel(params.get('model') ?? (hasCustom ? 'human' : 'procedural'));
frame();
bridge.onReady();
</script>
</body>
</html>
